<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreeti Computers</title>
  <meta name="color-scheme" content="only light">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      color-scheme: only light;
    }
    /* Thin subtle scrollbar */
    #chat-box::-webkit-scrollbar {
      width: 5px;
    }
    #chat-box::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    #chat-box::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-50 to-indigo-50 min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans text-slate-800">

  <!-- Chat Card -->
  <div 
    x-data="{
      sessionId: 'session_' + Math.random().toString(36).substring(2, 9),
      userInput: '',
      loading: false,
      showChips: true,
      messages: [
        { sender: 'bot', text: 'Hello! Welcome to Kreeti Computers. How can I help you today?' }
      ],
      chips: [
        'Which subjects do you teach?',
        'How long does it take to learn Python?',
        'How does the exam portal work?'
      ],
      async send(text) {
        const msg = (text || this.userInput).trim();
        if (!msg || this.loading) return;

        this.showChips = false;
        this.messages.push({ sender: 'user', text: msg });
        this.userInput = '';
        this.loading = true;
        this.scrollBottom();

        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: this.sessionId, message: msg })
          });
          const data = await res.json();
          this.messages.push({ sender: 'bot', text: data.reply });
        } catch (err) {
          this.messages.push({ sender: 'bot', text: 'Sorry, connection failed.' });
        } finally {
          this.loading = false;
          this.scrollBottom();
          this.$nextTick(() => { this.$refs.inputField?.focus(); });
        }
      },
      async clearChat() {
        await fetch('/chat/' + this.sessionId, { method: 'DELETE' });
        this.sessionId = 'session_' + Math.random().toString(36).substring(2, 9);
        this.messages = [
          { sender: 'bot', text: 'Hello! Welcome to Kreeti Computers. How can I help you today?' }
        ];
        this.showChips = true;
        this.userInput = '';
        this.$nextTick(() => { this.$refs.inputField?.focus(); });
      },
      scrollBottom() {
        this.$nextTick(() => {
          const box = document.getElementById('chat-box');
          if (box) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        });
      }
    }"
    class="w-full max-w-2xl h-screen sm:h-[min(85vh,700px)] sm:rounded-3xl shadow-xl bg-white border border-slate-200/80 flex flex-col overflow-hidden"
  >

    <!-- Header -->
    <header class="bg-white px-5 py-3.5 border-b border-slate-100 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <!-- Avatar K -->
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white font-semibold flex items-center justify-center text-base shadow-sm ring-2 ring-indigo-50">
          K
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-800 leading-tight">Kreeti Computers</h1>
          <p class="text-xs text-slate-500 flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Online - ask me about our courses
          </p>
        </div>
      </div>

      <!-- New Chat Ghost Button with Refresh Icon -->
      <button 
        @click="clearChat()" 
        title="New Chat"
        class="text-xs text-slate-500 hover:text-indigo-600 hover:bg-slate-100 px-2.5 py-1.5 rounded-lg border border-transparent hover:border-slate-200 transition flex items-center gap-1.5 font-medium"
      >
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
        <span class="hidden sm:inline">New Chat</span>
      </button>
    </header>

    <!-- Chat Messages Area -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4 bg-slate-50/40">
      <template x-for="(msg, i) in messages" :key="i">
        <div :class="msg.sender === 'user' ? 'flex justify-end' : 'flex justify-start items-end gap-2'">
          
          <!-- Bot Avatar beside each bot message -->
          <template x-if="msg.sender === 'bot'">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white font-semibold flex items-center justify-center text-xs shrink-0 shadow-xs mb-0.5">
              K
            </div>
          </template>

          <!-- Chat bubble: strictly x-text -->
          <div 
            :class="msg.sender === 'user' 
              ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-2xl rounded-br-sm shadow-sm' 
              : 'bg-white border border-slate-200/80 text-slate-700 rounded-2xl rounded-bl-sm shadow-xs'"
            class="max-w-[80%] px-4 py-2.5 text-[15px] leading-relaxed whitespace-pre-wrap break-words"
            x-text="msg.text"
          ></div>

        </div>
      </template>

      <!-- Typing Indicator: Three bouncing dots -->
      <div x-show="loading" class="flex justify-start items-end gap-2">
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white font-semibold flex items-center justify-center text-xs shrink-0 shadow-xs mb-0.5">
          K
        </div>
        <div class="bg-white border border-slate-200/80 rounded-2xl rounded-bl-sm px-4 py-3 shadow-xs flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0ms;"></span>
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 150ms;"></span>
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 300ms;"></span>
        </div>
      </div>
    </div>

    <!-- Quick Prompt Chips (Shown only before first user message) -->
    <div x-show="showChips" class="px-4 sm:px-5 py-2.5 bg-white border-t border-slate-100 flex flex-wrap gap-2 shrink-0">
      <template x-for="chip in chips" :key="chip">
        <button 
          @click="send(chip)" 
          class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-100/80 px-3.5 py-1.5 rounded-full transition font-medium cursor-pointer text-left"
          x-text="chip"
        ></button>
      </template>
    </div>

    <!-- Input Footer -->
    <footer class="p-3 sm:p-4 bg-white border-t border-slate-100 shrink-0">
      <form @submit.prevent="send()" class="flex items-center gap-2">
        <input 
          type="text" 
          x-ref="inputField"
          x-model="userInput" 
          autofocus
          placeholder="Ask a question..." 
          class="flex-1 bg-slate-100/90 border border-transparent focus:border-indigo-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-800 text-[15px] rounded-full px-4 py-2.5 transition placeholder-slate-400"
          :disabled="loading"
        />
        <button 
          type="submit" 
          :disabled="loading || !userInput.trim()"
          class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:hover:bg-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm transition cursor-pointer"
          title="Send"
        >
          <!-- Arrow Icon -->
          <svg class="w-4 h-4 translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>

  </div>

</body>
</html>
